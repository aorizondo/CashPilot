name: MystNodes
slug: mysterium
category: bandwidth
status: active
website: https://mystnodes.com
description: >
  MystNodes (Mysterium Network) is a decentralized VPN and proxy network built on
  blockchain technology. You earn MYST tokens by running a node that provides VPN,
  proxy, and data scraping services to users. Requires NET_ADMIN capability and
  host networking for full functionality. Includes a built-in web UI for node
  management. Works on both residential and VPS connections.
short_description: Decentralized VPN node - blockchain-based, works on VPS

referral:
  signup_url: "https://mystnodes.co/?referral_code=do7v7YOoBBpbOstKQovX2pUvZYKia4ZhH3QIdNtE"

docker:
  image: mysteriumnetwork/myst
  platforms: [linux/amd64, linux/arm64]
  env: []
  ports:
    - "4449:4449"
  volumes:
    - "mysterium-data:/var/lib/mysterium-node"
  command: "--ui.address=0.0.0.0 --tequilapi.address=0.0.0.0 service --agreed-terms-and-conditions"
  network_mode: "host"
  cap_add: [NET_ADMIN]
  privileged: true
  setup: >
    Mandatory steps after first deploy — otherwise mystnodes.com will show
    the node as "Monitoring failed" and you will not earn anything:

    1. Open the Node WebUI at  http://<this-host>:4449
    2. Complete the onboarding wizard. When the "Claim node" step
       links you to mystnodes.com, sign in (or sign up). mystnodes
       will generate a passphrase for this node and show it on screen.
       Copy it.
    3. Back in the Node WebUI, go to  Settings -> Change Password.
       Paste the passphrase mystnodes gave you into the "New password"
       and "Confirm new password" fields. Save.
    4. Same Settings page -> Settlement wallet -> enter your beneficiary
       wallet address (where MYST settles every 4 MYST).
    5. Within ~15 min the node moves from "Monitoring failed" to
       "Online" on https://my.mystnodes.com/nodes.

    Why steps 1-3 matter: the on-chain identity keystore is encrypted with
    a passphrase. The binary needs that same passphrase to sign every
    quality/metric event it sends to the network. mystnodes generates the
    passphrase during the claim flow; setting it via Change Password
    stores it into the keystore so the daemon can unlock the identity on
    every restart instead of relying on an in-memory cache that dies with
    the container.

requirements:
  residential_ip: false
  devices_per_ip: 0
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "4 MYST"
  currency: MYST
  frequency: "Auto-settle every 4 MYST to your beneficiary wallet"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Earnings in MYST tokens. Residential IPs earn significantly more. Node WebUI at port 4449 for management. VPS accepted. Port forwarding UDP 56000-56100 strongly recommended -- without it, nodes get Strict NAT status and many VPN sessions fail, severely reducing income. Important: after first run, set your beneficiary (settlement) wallet via the node WebUI or CLI to match your mystnodes.com account -- this links on-chain earnings to your cloud dashboard."

cashout:
  method: auto
  dashboard_url: "https://my.mystnodes.com/rewards"
  min_amount: 4.0
  currency: MYST
  notes: "Auto-settles every 4 MYST to your beneficiary wallet. No manual cashout needed. Visit Rewards page to claim bonus MYST."

platforms: [docker, windows, macos, linux, android, browser-extension]

collector:
  type: api
  notes: "Tequila API at http://localhost:4449/tequilapi/settlement/total-fees. Returns MYST in wei (10^18). No auth needed."
